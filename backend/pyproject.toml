[project]
name = "smartmart-backend"
version = "1.0.0"
description = "SmartMart Backend API Service with AI Recognition"
requires-python = ">=3.11"
dependencies = [
    # ========== 核心框架 ==========
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # ========== 数据库 ==========
    "sqlalchemy>=2.0.25",
    
    # ========== 文件处理 ==========
    "python-multipart>=0.0.6",
    "pillow>=10.2.0",
    
    # ========== WebSocket ==========
    "websockets>=12.0",
    
    # ========== AI 识别模块 ==========
    "numpy>=1.26.0",
    # torch, torchvision, faiss, transformers 需通过 conda 单独安装
    # GPU: conda install -c pytorch -c nvidia -c conda-forge "pytorch>=2.6" torchvision torchaudio pytorch-cuda=12.4 faiss-gpu
    # CPU: conda install -c pytorch -c conda-forge pytorch torchvision torchaudio cpuonly faiss-cpu
    # conda install -c huggingface -c conda-forge "transformers>=4.36,<5"
    
    # ========== OCR 文字识别 ==========
    "rapidocr",
    # GPU: pip install onnxruntime-gpu（需 CUDA，与 onnxruntime 二选一）
    # CPU: pip install onnxruntime（无 GPU 时使用）
    "onnxruntime",
    
    # ========== 工具 ==========
    "httpx>=0.25.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

